services:
  nginx:
    build: requirements/nginx/.
    container_name: nginx
    depends_on:
      - wordpress
      - mariadb
    ports:
      - "80:80"
    volumes:
      - wordpress_web:/var/www/html
    networks:
      inception:
  wordpress:
    build: requirements/wordpress/.
    container_name: wp-php
    depends_on:
      - mariadb
    volumes:
      - wordpress_web:/var/www/html
    networks:
      inception:
  mariadb:
    build: requirements/mariadb/.
    container_name: mariadb
    volumes:
      - wordpress_db:/var/lib/mysql
    networks:
      inception:

networks:
  inception:

volumes:
  wordpress-web:
    name: "/home/svan-hoo/data/wordpress_web"
  wordpress-db:
    name: "/home/svan-hoo/data/wordpress_db"
