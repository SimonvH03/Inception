services:
  nginx:
    build: nginx/
    container_name: nginx
    depends_on:
      - wordpress
      - mariadb
    ports:
      - 443:443
    volumes:
      - web:/var/www/html
    networks:
      inception:

  wordpress:
    build: wordpress/
    container_name: wp-php
    depends_on:
      - mariadb
    volumes:
      - web:/var/www/html
    networks:
      inception:

  mariadb:
    build: mariadb/
    container_name: mariadb
    volumes:
      - db:/var/lib/mysql
    networks:
      inception:

volumes:
  web:
    driver: local
    driver_opts:
      type: none
      device: /home/svan-hoo/data/wordpress_web
      o: bind

  db:
    driver: local
    driver_opts:
      type: none
      device: /home/svan-hoo/data/wordpress_db
      o: bind

networks:
  inception:
